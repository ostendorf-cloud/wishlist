services:
  wishlist:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      LOG_LEVEL: "debug"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "wishlist"
      DB_USER: "wishlist"
      # An obvious dummy for local development only. A real deployment uses
      # DB_PASSWORD_FILE and a mounted secret.
      DB_PASSWORD: "dev-password-not-real"
      # The compose network is local and the server has no certificate.
      DB_SSLMODE: "disable"
      # Local development only: the session cookie is sent over plain http, so
      # the stack works at http://127.0.0.1:8080 without a certificate. Safe
      # here because the ports below are published on 127.0.0.1 only. The Helm
      # chart never sets either variable. Register an account in the SPA and
      # add the TOTP secret it shows to an authenticator app.
      WISHLIST_ALLOW_PLAIN_HTTP: "true"
      WISHLIST_ALLOW_PLAIN_HTTP_ANY_LISTENER: "true"
      # Open for local development. The binary and the Helm chart close it by default.
      REGISTRATION_OPEN: "true"
      # Counting is off unless both UMAMI_ values are set, in .env.
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

  # Local development only. Published on the loopback interface so the store
  # tests can reach it:
  #   export WISHLIST_TEST_DATABASE_URL='postgres://wishlist:dev-password-not-real@127.0.0.1:5432/postgres?sslmode=disable'
  postgres:
    # Tag only: Renovate pins the manifest list digest, see renovate.json.
    image: postgres:19-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    restart: unless-stopped
    environment:
      POSTGRES_USER: "wishlist"
      POSTGRES_PASSWORD: "dev-password-not-real"
      POSTGRES_DB: "wishlist"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
