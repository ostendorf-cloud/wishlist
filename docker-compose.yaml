services:
  wishlist:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      LOG_LEVEL: "debug"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "wishlist"
      DB_USER: "wishlist"
      # An obvious dummy for local development only. A real deployment uses
      # DB_PASSWORD_FILE and a mounted secret.
      DB_PASSWORD: "dev-password-not-real"
      # The compose network is local and the server has no certificate.
      DB_SSLMODE: "disable"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

  # Local development only. Published on the loopback interface so the store
  # tests can reach it:
  #   export WISHLIST_TEST_DATABASE_URL='postgres://wishlist:dev-password-not-real@127.0.0.1:5432/postgres?sslmode=disable'
  postgres:
    # Tag only: Renovate pins the manifest list digest, see renovate.json.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "wishlist"
      POSTGRES_PASSWORD: "dev-password-not-real"
      POSTGRES_DB: "wishlist"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist -d wishlist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
