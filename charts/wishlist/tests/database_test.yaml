suite: database configuration
templates:
  - templates/deployment.yaml
tests:
  - it: passes the connection settings as environment variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: wishlist-postgres-rw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PORT
            value: "5432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_NAME
            value: app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            value: app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_SSLMODE
            value: require
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_MAX_CONNS
            value: "10"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_CONNECT_TIMEOUT
            value: 5s

  - it: hands the password over as a file, never as an environment value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD_FILE
            value: /etc/wishlist/database/password
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "DB_PASSWORD")]
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: wishlist-postgres-app

  - it: follows the secret and key names from the values
    set:
      database:
        existingSecret:
          name: other-secret
          passwordKey: db-pass
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: other-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD_FILE
            value: /etc/wishlist/database/db-pass

  - it: rejects an empty database host through the values schema
    set:
      database:
        host: ""
    asserts:
      - failedTemplate:
          errorPattern: /database/host
