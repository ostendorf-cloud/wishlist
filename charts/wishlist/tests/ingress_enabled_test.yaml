suite: ingress enabled
templates:
  - templates/ingress.yaml
  - templates/httproute.yaml
set:
  auth:
    trustedProxies:
      - 10.42.0.0/16
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: wishlist.example.com
        paths:
          - path: /
            pathType: Prefix
tests:
  - it: renders one Ingress for the configured host
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: wishlist.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-wishlist
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080

  - it: routes only the public port, never govue's admin listener, even when the two differ from their defaults
    template: templates/ingress.yaml
    set:
      service:
        port: 9000
        adminPort: 9001
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9000
      - notEqual:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 9001

  - it: renders no HTTPRoute when ingress is the chosen route
    template: templates/httproute.yaml
    asserts:
      - hasDocuments:
          count: 0
