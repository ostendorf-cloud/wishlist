# Run with --skip-schema-validation (task test:helm does): the schema refuses
# replicaCount above 1 first, and helm-unittest cannot assert a schema failure.
# This proves the template guard that backs the schema up.
suite: replicaCount guard in the template
templates:
  - templates/deployment.yaml
tests:
  - it: fails the render with more than one replica when the schema is skipped
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: replicaCount cannot be above 1
