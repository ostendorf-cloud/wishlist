apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wishlist.fullname" . }}
  labels:
    {{- include "wishlist.labels" . | nindent 4 }}
spec:
  {{/*
  Ingress and httpRoute are mutually exclusive: both pick an external route
  for the same hostname, and only one may be the deployment's actual front
  door. This guard lives here, not duplicated into templates/ingress.yaml
  and templates/httproute.yaml, because templates/deployment.yaml always
  renders regardless of which routing flag is set (or neither), so a single
  check here fires exactly once, deterministically, however Helm orders
  template execution across files.
  */}}
  {{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
  {{ fail "ingress.enabled and httpRoute.enabled cannot both be true: pick one external route and turn the other off." }}
  {{- end }}
  {{/*
  Behind an ingress or an HTTPRoute every request comes from the proxy. With no
  trusted proxy the sign in limits key by that one address, so all callers share
  one bucket and one caller can lock out the rest.
  */}}
  {{- if and (or .Values.ingress.enabled .Values.httpRoute.enabled) (not .Values.auth.trustedProxies) }}
  {{ fail "auth.trustedProxies must be set when ingress.enabled or httpRoute.enabled is true: with no trusted proxy every request is attributed to the proxy's own address, which collapses the per address sign in limits into one shared bucket for every caller. Set it to the CIDR of the ingress controller or gateway pods; see README.md." }}
  {{- end }}
  {{/*
  Sessions live in the memory of one process. More than one replica would give
  every pod its own sessions: this guard and values.schema.json both refuse it.
  */}}
  {{- if gt (int .Values.replicaCount) 1 }}
  {{ fail "replicaCount cannot be above 1: sessions are kept in the memory of the process, so a second replica would not know them. Scaling out needs a shared session store in the service first." }}
  {{- end }}
  {{/*
  The root certificate and the mode go together, as in the service's own
  config: verify-ca and verify-full need a root to verify against, and the
  modes that never verify would ignore it. The service refuses both at start,
  this guard says so at render time instead.
  */}}
  {{- $sslMode := .Values.database.sslMode }}
  {{- $sslRoot := .Values.database.sslRootCert.secretName }}
  {{- if and (has $sslMode (list "verify-ca" "verify-full")) (not $sslRoot) }}
  {{ fail (printf "database.sslRootCert.secretName is required when database.sslMode is %s: the server certificate is checked against that root. For CloudNativePG it is the Secret \"<cluster>-ca\", key \"ca.crt\"." $sslMode) }}
  {{- end }}
  {{- if and (has $sslMode (list "disable" "allow" "prefer")) $sslRoot }}
  {{ fail (printf "database.sslRootCert.secretName cannot be set when database.sslMode is %s: that mode never verifies the server certificate, so the root would be ignored." $sslMode) }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wishlist.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wishlist.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wishlist.serviceAccountName" . }}
      # This application makes no Kubernetes API calls of its own; see
      # templates/serviceaccount.yaml and values.yaml. Set on the pod too,
      # not only the ServiceAccount, since the pod spec's own value would
      # otherwise win if it were ever left unset here.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ required "database.name is required" .Values.database.name | quote }}
            - name: DB_USER
              value: {{ required "database.user is required" .Values.database.user | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslMode | quote }}
            {{- with .Values.database.sslRootCert.secretName }}
            - name: DB_SSLROOTCERT
              value: /etc/wishlist/database-ca/{{ required "database.sslRootCert.key is required" $.Values.database.sslRootCert.key }}
            {{- end }}
            - name: DB_MAX_CONNS
              value: {{ .Values.database.maxConns | quote }}
            - name: DB_CONNECT_TIMEOUT
              value: {{ .Values.database.connectTimeout | quote }}
            - name: REGISTRATION_OPEN
              value: {{ .Values.auth.registrationOpen | quote }}
            {{- with .Values.auth.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.config.siteUrl }}
            - name: SITE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.umami.url }}
            - name: UMAMI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.umami.websiteId }}
            - name: UMAMI_WEBSITE_ID
              value: {{ . | quote }}
            {{- end }}
            # The password is a file, never an environment value: it would show
            # up in "kubectl describe" and in the process environment.
            - name: DB_PASSWORD_FILE
              value: /etc/wishlist/database/{{ required "database.existingSecret.passwordKey is required" .Values.database.existingSecret.passwordKey }}
          volumeMounts:
            - name: database
              mountPath: /etc/wishlist/database
              readOnly: true
            {{- if .Values.database.sslRootCert.secretName }}
            - name: database-ca
              mountPath: /etc/wishlist/database-ca
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.service.adminPort }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: database
          secret:
            secretName: {{ required "database.existingSecret.name is required" .Values.database.existingSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.database.existingSecret.passwordKey }}
                path: {{ .Values.database.existingSecret.passwordKey }}
        {{- with .Values.database.sslRootCert.secretName }}
        # Only the certificate key is projected: a CloudNativePG CA Secret also
        # holds the CA's private key, which this pod must never see.
        - name: database-ca
          secret:
            secretName: {{ . }}
            defaultMode: 0444
            items:
              - key: {{ required "database.sslRootCert.key is required" $.Values.database.sslRootCert.key }}
                path: {{ $.Values.database.sslRootCert.key }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
