name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:fmt

  golangci-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:golangci-config

  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since build, test and govue-version each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-vet-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-test-
            ${{ runner.os }}-govue-version-
      - run: task lint:vet

  golangci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules, build output and golangci-lint
        # Caches the same module and build directories as the other Go
        # jobs, plus golangci-lint's own analysis cache.
        #
        # Own cache key, like vet, build, test and govue-version each have.
        # actions/cache reserves a key for whichever job saves it first, so
        # a shared key across jobs would silently drop the others' saves.
        # This job also caches the golangci-lint analysis directory the
        # other jobs don't use, which is why none of them falls back to
        # this key. The reverse holds though: falling back to a sibling
        # gives this job their module and build cache without the lint
        # directory, which is incomplete rather than wrong, and better
        # than cold.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-golangci-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-test-
            ${{ runner.os }}-govue-version-
      - run: task lint:golangci

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:markdown

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:actions

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:secrets

  # The shared reusable workflow pins addlicense itself and takes the file
  # set as complete "find" invocations, one per line. task lint:license
  # keeps the same invocation for local development, kept in step by hand.
  license:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-license.yaml@v0
    with:
      copyright-holder: Simon Ostendorf
      year: "2026"
      # Mirrors mise.toml's own pin, so the same addlicense runs locally
      # and in CI.
      addlicense-version: "1.2.0"
      find-commands: |
        find . -name "*.go" -not -path "./.claude/worktrees/*" -not -path "*/node_modules/*"
        find web/src -type f \( -name "*.ts" -o -name "*.vue" \) -not -path "*/node_modules/*" -not -path "*/dist/*"

  web-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:lint

  web-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:format

  web-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:types

  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task web:test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, test and govue-version each cache a different
        # module set. A miss falls back to this job's own cache first, then
        # to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-test-
            ${{ runner.os }}-govue-version-
      - run: task build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The store tests run against a real PostgreSQL, never a fake. Each test
    # creates and drops a database of its own, so the role needs CREATEDB:
    # the image's POSTGRES_USER is a superuser.
    #
    # The image is a tag for now, not yet a manifest list digest: it could
    # not be resolved offline when this was written. Renovate's shared preset
    # sets pinDigests, so its first pull request adds the "@sha256:" digest.
    services:
      postgres:
        image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
        env:
          POSTGRES_USER: wishlist
          POSTGRES_PASSWORD: ci-dummy-password-not-real
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishlist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WISHLIST_TEST_DATABASE_URL: postgres://wishlist:ci-dummy-password-not-real@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # Module cache avoids re-downloading dependencies, build cache keeps
        # a recompile fast instead of starting cold.
        #
        # Own key, since vet, build and govue-version each cache a
        # different module set. A miss falls back to this job's own cache
        # first, then to the others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-test-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-govue-version-
      - run: task test:go

  govue-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Cache Go modules and build output
        # check:govue-version runs go test against internal/depsync, which
        # needs the same module and build cache as the other Go jobs.
        #
        # Own key, since vet, build and test each cache a different module
        # set. A miss falls back to this job's own cache first, then to the
        # others, which still covers most packages.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-govue-version-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-govue-version-
            ${{ runner.os }}-vet-
            ${{ runner.os }}-build-
            ${{ runner.os }}-test-
      - run: task check:govue-version

  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:docker

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:shell

  docker-build:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: wishlist:smoke
      - run: scripts/smoke-test-image.sh wishlist:smoke

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task lint:helm

  kubeconform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task validate:kubeconform

  helm-unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: task test:helm

  renovate-config:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-renovate-config.yaml@v0
