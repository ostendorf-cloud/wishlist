version: "3"

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:fmt:
    desc: Go format check through golangci-lint
    cmds:
      - golangci-lint fmt --diff

  lint:golangci-config:
    desc: golangci-lint configuration check
    cmds:
      - golangci-lint config verify

  # Both targets typecheck cmd/wishlist, whose go:embed pattern fails on an empty
  # dist/, so the frontend has to exist before either one runs.
  lint:vet:
    desc: Go vet
    deps: [web:build]
    cmds:
      - go vet ./...

  lint:golangci:
    desc: golangci-lint run
    deps: [web:build]
    cmds:
      - golangci-lint run ./...

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:license:
    desc: License header check for every Go and web source file
    cmds:
      - |
        addlicense -check -c "Simon Ostendorf" -y 2026 -f .license-header.txt \
          $(find . -name "*.go" -not -path "./.claude/worktrees/*" -not -path "*/node_modules/*") \
          $(find web/src -type f \( -name "*.ts" -o -name "*.vue" \) \
            -not -path "*/node_modules/*" -not -path "*/dist/*")

  lint:docker:
    desc: Dockerfile lint
    cmds:
      - hadolint Dockerfile

  lint:shell:
    desc: Shell lint and format check over scripts/
    cmds:
      - shellcheck scripts/*.sh
      - shfmt --diff --indent 2 --case-indent scripts/*.sh

  lint:helm:
    desc: Helm chart lint
    cmds:
      - helm lint charts/wishlist

  validate:kubeconform:
    desc: Schema validation of the rendered Helm chart
    cmds:
      - helm template charts/wishlist | kubeconform -strict -summary

  # helm-unittest is a Helm plugin, and helm only finds a plugin inside HELM_PLUGINS.
  # The mise entry's postinstall copies it into helm's own plugin directory, but that
  # hook runs only on a fresh install: a cached tool skips it. This builds a plugin
  # directory holding exactly one entry, pointing at whatever mise resolved, so the
  # target no longer depends on the hook having run.
  helm:plugins:
    desc: Link helm-unittest into a plugin directory helm can read
    internal: true
    run: once
    cmds:
      - rm -rf .task/helm-plugins
      - mkdir -p .task/helm-plugins
      - ln -s "$(mise where 'github:helm-unittest/helm-unittest')" .task/helm-plugins/unittest

  test:helm:
    desc: Helm chart unit tests
    deps: [helm:plugins]
    env:
      HELM_PLUGINS: .task/helm-plugins
    cmds:
      - helm unittest charts/wishlist

  build:
    desc: Compile the wishlist binary
    deps: [web:build]
    cmds:
      - go build -o bin/wishlist ./cmd/wishlist

  test:go:
    desc: Go test
    deps: [web:build]
    cmds:
      - go test -race -count=1 ./...

  check:govue-version:
    desc: Verify go.mod and web/package.json pin the same govue version, and that the lockfile pins its subdirectory
    cmds:
      - go test -race -count=1 ./internal/depsync/...

  web:deps:
    desc: Install the web/ dependencies
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: ESLint over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run lint

  web:format:
    desc: Prettier format check over the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format:check

  web:types:
    desc: TypeScript and template typecheck of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run typecheck

  web:test:
    desc: Vitest suite of the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run test

  web:build:
    desc: Build the SPA bundle into cmd/wishlist/dist
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run build

  web:fmt:
    desc: Format the web/ package
    dir: web
    deps: [web:deps]
    cmds:
      - pnpm run format

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:fmt
      - task: lint:golangci-config
      - task: lint:vet
      - task: lint:golangci
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: lint:license
      - task: lint:docker
      - task: lint:shell
      - task: lint:helm
      - task: validate:kubeconform
      - task: test:helm
      - task: web:lint
      - task: web:format
      - task: web:types
      - task: web:test
      - task: web:build
      - task: build
      - task: test:go
      - task: check:govue-version

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt
